[project]
name = "job-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Simon Schmalfuss"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)",
    "pika (>=1.3.2,<2.0.0)",
    "python-postman (>=0.9.1,<0.10.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "uvicorn (>=0.47.0,<0.48.0)"
    
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
