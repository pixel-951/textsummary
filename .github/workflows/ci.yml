name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - model-service
          - job-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: poetry install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: poetry run pytest



  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build



  system-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Start Compose stack
        run: |
          docker compose docker-compose.yml up -d --build

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)" >/dev/null 2>&1; then
              echo "Stack is ready"
              exit 0
            fi
            echo "Waiting for stack..."
            sleep 2
          done

          docker compose docker-compose.yml ps
          docker compose docker-compose.yml logs --no-color
          exit 1

      - name: Run system tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          pytest -m system tests/system

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose docker-compose.yml ps
          docker compose docker-compose.yml logs --no-color

      - name: Shut down Compose stack
        if: always()
        run: |
          docker compose  docker-compose.yml down -v