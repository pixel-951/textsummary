services:
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-service:
    build: ./job-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      QUEUE_NAME: jobs
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
   
  model-service:
    build: ./model-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      QUEUE_NAME: jobs
      NOTIFICATION_URL: http://notification-service:8001/api/notification
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    volumes: 
      - model-service-weights:/home/appuser/.cache/huggingface

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - job-service
      - notification-service

volumes:
  model-service-weights: